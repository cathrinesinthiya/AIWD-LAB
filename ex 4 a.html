<!DOCTYPE html>
<html>
<head>
<title>Currency Converter</title>
<style>

body{
font-family: Arial;
background:#f2f2f2;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
border:3px solid black;
padding:30px;
width:350px;
text-align:center;
background:white;
}

h1{
color:blue;
}

input,select{
width:90%;
padding:8px;
margin:10px;
font-size:16px;
}

button{
width:95%;
padding:10px;
background:blue;
color:white;
font-size:18px;
border-radius:20px;
border:none;
cursor:pointer;
}

.result{
margin-top:20px;
background:blue;
color:white;
padding:10px;
font-size:20px;
border-radius:20px;
}

</style>
</head>

<body onload="init()">

<div class="container">

<h1>Currency Converter</h1>

<label>Amount:</label>
<input type="number" id="amount" value="1" onkeyup="convert()">

<label>From:</label>
<select id="from" onchange="convert()">
<option value="USD">USD</option>
<option value="INR">INR</option>
<option value="EUR">EUR</option>
<option value="GBP">GBP</option>
</select>

<label>To:</label>
<select id="to" onchange="convert()">
<option value="INR">INR</option>
<option value="USD">USD</option>
<option value="EUR">EUR</option>
<option value="GBP">GBP</option>
</select>

<button onclick="convert()">Convert</button>

<div class="result" id="result">
Amount = 0
</div>

</div>

<script>

function init(){
convert();
}

function convert(){

let amount=document.getElementById("amount").value;
let from=document.getElementById("from").value;
let to=document.getElementById("to").value;

let rates={
USD:1,
INR:72,
EUR:0.9,
GBP:0.8
};

let result=(amount/rates[from])*rates[to];

document.getElementById("result").innerHTML="Amount = "+Math.round(result);

}

</script>

</body>
</html>
