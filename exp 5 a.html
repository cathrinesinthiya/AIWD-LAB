<!DOCTYPE html>
<html>
<head>
    <title>Quiz App</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f5f5f5;
        }
        .quiz-container {
            background: white;
            padding: 20px;
            width: 50%;
            margin: auto;
            margin-top: 50px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        #timer {
            font-size: 20px;
            color: red;
        }
        #warning {
            color: orange;
            font-weight: bold;
        }
        button {
            padding: 10px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="quiz-container">
    <h2>Quiz App</h2>

    <p id="timer">Time Left: 10</p>
    <p id="warning"></p>

    <form id="quizForm">

        <p>1. What is JavaScript?</p>
        <input type="radio" name="q1" value="a"> Language<br>
        <input type="radio" name="q1" value="b"> Database<br>

        <p>2. What does DOM stand for?</p>
        <input type="radio" name="q2" value="a"> Document Object Model<br>
        <input type="radio" name="q2" value="b"> Data Object Model<br>

        <p>3. Which keyword is used for variable?</p>
        <input type="radio" name="q3" value="a"> var<br>
        <input type="radio" name="q3" value="b"> define<br>

        <p>4. Which method selects ID?</p>
        <input type="radio" name="q4" value="a"> getElementById<br>
        <input type="radio" name="q4" value="b"> queryAll<br>

        <p>5. JavaScript runs on?</p>
        <input type="radio" name="q5" value="a"> Browser<br>
        <input type="radio" name="q5" value="b"> Compiler<br>

        <br>
        <button type="button" onclick="submitQuiz()">Submit</button>
    </form>

    <h3 id="score"></h3>
</div>

<script>
    let timeLeft = 10;
    let timer = document.getElementById("timer");
    let warning = document.getElementById("warning");

    // ✅ TC06: Object for correct answers
    const answers = {
        q1: "a",
        q2: "a",
        q3: "a",
        q4: "a",
        q5: "a"
    };

    // ✅ TC01 & TC02: Timer starts and counts down
    let interval = setInterval(() => {
        timeLeft--;
        timer.textContent = "Time Left: " + timeLeft;

        // ✅ TC03: Warning at 5 seconds
        if (timeLeft === 5) {
            warning.textContent = "Only 5 seconds remaining!";
        }

        // ✅ TC04: Auto submit
        if (timeLeft === 0) {
            submitQuiz();
        }

    }, 1000);

    function submitQuiz() {

        clearInterval(interval); // ✅ TC05: Stop timer

        let score = 0;

        // ✅ TC07: Score calculation
        for (let key in answers) {
            let selected = document.querySelector(`input[name="${key}"]:checked`);
            if (selected && selected.value === answers[key]) {
                score++;
            }
        }

        document.getElementById("score").textContent = "Score: " + score + "/5";

        // ✅ TC08: Disable inputs
        let inputs = document.querySelectorAll("input");
        inputs.forEach(input => input.disabled = true);

        // Disable submit button
        document.querySelector("button").disabled = true;
    }
</script>

</body>
</html>
